name: Windows UI screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render + capture
        run: python packaging/windows/screenshot.py packaging/windows/win_ui.png

      - uses: actions/upload-artifact@v4
        with:
          name: win-ui
          path: packaging/windows/win_ui.png
