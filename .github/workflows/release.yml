name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- macOS:菜单栏 App + pkg ----------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build GHSpeed.app + pkg 安装包
        run: ./make_pkg.sh

      - name: Package
        run: |
          cd dist
          zip -qry "GHSpeed-macos-${GITHUB_REF_NAME}.zip" GHSpeed.app
          ls -lh *.zip *.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.pkg

  # ---------- Linux(Debian):.deb,无 UI ----------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          mkdir -p pkg/DEBIAN pkg/usr/bin
          sed "s/@VERSION@/$V/" packaging/deb/control > pkg/DEBIAN/control
          cp ghspeed.py pkg/usr/bin/ghspeed
          chmod 755 pkg/usr/bin/ghspeed
          dpkg-deb --build --root-owner-group pkg "ghspeed_${V}_all.deb"
          ls -lh *.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ghspeed_*_all.deb

  # ---------- Windows 10+:CLI + tkinter 简易界面 ----------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage\GHSpeed | Out-Null
          Copy-Item ghspeed.py, ghspeed_gui.pyw, ghspeed.bat, README.md stage\GHSpeed\
          $v = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path stage\GHSpeed -DestinationPath "GHSpeed-windows-${{ github.ref_name }}.zip"
          Get-ChildItem *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: GHSpeed-windows-*.zip

  # ---------- 汇总发布(打 tag 时)----------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(find artifacts -type f \( -name "*.pkg" -o -name "*.zip" -o -name "*.deb" \) | tr '\n' ' ')
          echo "发布文件: $FILES"
          cat > notes.md <<'EOF'
          ## GHSpeed ${{ github.ref_name }}

          GitHub 专用加速工具:测速固定最快 IP 到 hosts + 镜像加速下载。只碰 GitHub,不碰其他网络。

          ### macOS(菜单栏 🐙)
          1. 下载 `GHSpeed-macos-*.pkg` 双击安装;被 Gatekeeper 拦截就先
             `xattr -d com.apple.quarantine ~/Downloads/GHSpeed-macos-*.pkg`
          2. 点菜单栏 🐙 → 「开启加速」(或用 `GHSpeed-macos-*.zip` 免安装)

          ### Windows 10+(简易界面)
          1. 先装 [Python 3](https://www.python.org/downloads/)(勾选 Add to PATH)
          2. 解压 `GHSpeed-windows-*.zip`,双击 `GHSpeed_gui.pyw`(或命令行 `ghspeed.bat`)
          3. 点「开启加速」,UAC 弹窗选「是」(需管理员改 hosts + 建计划任务)

          ### Linux / Debian(命令行,无 UI)
          ```
          sudo dpkg -i ghspeed_*_all.deb
          sudo ghspeed on     # 关闭:sudo ghspeed off
          ```
          开启后自动装 systemd 定时器,每 30 分钟重测刷新。
          EOF
          gh release create "$GITHUB_REF_NAME" $FILES \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
