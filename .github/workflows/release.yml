name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- macOS:菜单栏 App + pkg ----------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build GHSpeed.app + pkg 安装包
        run: ./make_pkg.sh

      - name: Package
        run: |
          cd dist
          zip -qry "GHSpeed-macos-${GITHUB_REF_NAME}.zip" GHSpeed.app
          ls -lh *.zip *.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.pkg

  # ---------- Linux(Debian):.deb,无 UI ----------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/local/share/ghspeed
          sed "s/@VERSION@/$V/" packaging/deb/control > pkg/DEBIAN/control
          cp ghspeed.py pkg/usr/bin/ghspeed
          cp ghspeed_sni.py pkg/usr/local/share/ghspeed/ghspeed_sni.py
          chmod 755 pkg/usr/bin/ghspeed
          dpkg-deb --build --root-owner-group pkg "ghspeed_${V}_all.deb"
          ls -lh *.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ghspeed_*_all.deb

  # ---------- Windows 10+:安装包(setup)+ 便携 zip,均内置运行时免装 Python ----------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exes (PyInstaller)
        run: |
          pip install pyinstaller pillow pystray
          python -c "from PIL import Image; im = Image.open('icons/icon_1024.png'); im.save('icons/icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          Copy-Item ghspeed_gui.pyw gui_entry.py
          pyinstaller --onefile --noconsole --name GHSpeed --icon icons/icon.ico --add-data "icons/icon_1024.png;icons" --add-data "ghspeed_sni.py;." --hidden-import pystray._win32 --hidden-import socketserver gui_entry.py
          pyinstaller --onefile --name ghspeed-cli --icon icons/icon.ico --add-data "ghspeed_sni.py;." --hidden-import socketserver ghspeed.py

      - name: 冒烟测试(GHSpeed.exe 必须真机启动出可见 GUI 窗口;CLI 可运行)
        shell: pwsh
        run: |
          Start-Process -FilePath dist\GHSpeed.exe
          Start-Sleep -Seconds 15
          $p = Get-Process GHSpeed -ErrorAction SilentlyContinue
          if ($p -and $p.MainWindowHandle -ne 0 -and $p.MainWindowTitle) {
            Write-Host "GHSpeed.exe GUI alive, window='$($p.MainWindowTitle)'"
            Stop-Process -Id $p.Id -Force
          } else {
            $t = if ($p) { $p.MainWindowTitle } else { "(process dead)" }
            Write-Host "GHSpeed.exe is not a visible GUI window (title='$t')"
            if (Test-Path "$env:LOCALAPPDATA\GHSpeed_error.log") {
              Get-Content "$env:LOCALAPPDATA\GHSpeed_error.log" | Select-Object -Last 40
            }
            if (Test-Path "warn-GHSpeed.txt") {
              Get-Content "warn-GHSpeed.txt" | Select-Object -Last 30
            }
            exit 1
          }
          $v = & dist\ghspeed-cli.exe --version
          Write-Host "CLI: $v"
          if ($v -notmatch "ghspeed") { exit 1 }
          # SNI 插件回归门禁:插件是运行时从文件懒加载的,它的顶层依赖
          # (socketserver 等)不在引擎 import 图里,漏了 --hidden-import 时
          # 只有真加载才炸。用 sni git 门禁:插件加载失败时引擎 sys.exit
          # 非零退出(sni state 会优雅降级成 0 退出,门不住);插件在时
          # 只读一条 git 配置,无副作用。
          & dist\ghspeed-cli.exe sni git
          if ($LASTEXITCODE -ne 0) { Write-Host "SNI 插件加载失败(打包缺依赖)"; exit 1 }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Get-Content VERSION -Raw).Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path stage\GHSpeed | Out-Null
          Copy-Item dist\GHSpeed.exe, dist\ghspeed-cli.exe, ghspeed.py, ghspeed_sni.py, ghspeed_gui.pyw, ghspeed.bat, README.md stage\GHSpeed\
          Compress-Archive -Path stage\GHSpeed -DestinationPath "GHSpeed-windows-${{ github.ref_name }}.zip"
          Get-ChildItem dist\*.exe, *.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/GHSpeed-windows-setup-*.exe
            GHSpeed-windows-*.zip

  # ---------- 汇总发布(打 tag 时)----------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS
        run: |
          find artifacts -type f \( -name "*.pkg" -o -name "*.zip" -o -name "*.deb" -o -name "*.exe" \) -print0 \
            | xargs -0 sha256sum | awk '{n=split($2,a,"/"); print $1"  "a[n]}' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(find artifacts -type f \( -name "*.pkg" -o -name "*.zip" -o -name "*.deb" -o -name "*.exe" \) | tr '\n' ' ')
          FILES="$FILES SHA256SUMS.txt"
          echo "发布文件: $FILES"
          cat > notes.md <<'EOF'
          ## GHSpeed ${{ github.ref_name }}

          GitHub 专用加速工具:测速固定最快 IP 到 hosts + 镜像加速下载。只碰 GitHub,不碰其他网络。

          ### v0.6.2 变更(热修:下载档位/SNI 分片在打包版报「找不到 ghspeed_sni.py」)
          - **插件依赖进包**:ghspeed_sni.py 是运行时懒加载的,它的顶层依赖
            (socketserver)不在引擎 import 图里,PyInstaller 没打进去——打包版里
            点「下载档位」「SNI 分片」加载即炸(还被误报成「文件缺失,重装可修复」,
            掩盖了真因)。已补 `--hidden-import socketserver`,CI 冒烟新增
            「插件真加载」门禁,以后这类缺失直接构建失败,不再带病发布
          - **引擎补齐插件转发层**:v0.5.1 拆插件时薄封装漏了 sni_pac_on/
            sni_start_inproc/_sni_spawn_relay/sni_cfg 等一批,Windows 界面的
            SNI 按钮即使插件在也会 AttributeError。现在引擎模块级 `__getattr__`
            把 sni_*/tier_*/cmd_sni*/cmd_tier* 一律转发给插件,以后插件新增函数
            eng.* 自动可用,不再漂移;插件加载失败时错误信息如实显示真因
          - 顺带(含 v0.6.1 重发布热修):Windows 单实例守卫——GHSpeed.exe 被反复
            拉起不再无限弹窗;提权失败不再自我循环;自更新后底栏不再误报「可升级」。
            **装着坏 v0.6.1 的用户会收到应用内升级提示(托盘「检查更新」)**

          ### v0.6.1 变更(能力补全:界面入口 + 自更新)
          - **下载档位接进两个界面**:macOS 菜单栏「本地下载档位(可选)」、Windows 窗口
            「下载档位」按钮——点一下即可,依赖的 SNI 分片会自动连带开启(不再需要先记
            `sni on`);关闭时服务、本地 CA、PAC 一起收口。首次开启会生成并安装本地 CA,
            只对 codeload/raw/objects 等文件域选择性解密,github.com 网页与登录 Cookie
            永不解密
          - **`ghspeed update` 自更新**:检查新版 → 经镜像通道下载 → sha256 校验 →
            自动打开系统安装器。检查有三条退路(API 直连 / releases-latest 重定向走镜像 /
            资产页解析),坏窗口里也能查;下载复用镜像链 + 分片并行 + 断点续传;
            `--check` 只看,`--json` 给界面调用
          - **两个界面每天静默查一次新版**:有更新才提示(macOS 菜单项变「有新版 vX」并
            弹通知,Windows 底栏提示 + 托盘右键「检查更新」),不打断使用
          - 菜单栏在已装 CLI 落后于 App 版本时自动改用 App 内引擎,并顺手把 CLI 升到
            同版本——新增命令不再在旧 CLI 上报「invalid choice」
          - 发布物附 `SHA256SUMS.txt`(更新校验与第三方复验共用)

          ### v0.6.0 变更(下载全链打通 + 自愈下沉引擎)
          - **本地下载档位 `ghspeed tier on`**(重头戏,可选):本地代理只对 codeload/raw/
            objects 等文件域做选择性解密(本地 CA 装用户级信任,off 自动摘除,免 sudo),
            把浏览器下载请求改写成实测最快镜像通道回源;github.com 网页与登录 Cookie
            永不解密,其余域透明转发——浏览器点 release 下载无感吃到多通道,断点续传保留
          - **域名清单补齐 19 个**:github.githubassets.com(页面 JS/CSS)、user-images、
            collector(遥测)、uploads.github.com(上传通道)、media(LFS)等,hosts/PAC/
            SNI 白名单单一事实源自动跟随
          - **`ghspeed watch` 自愈命令**:健康快查几秒收工,坏窗口内 60 秒一拍重测;
            三平台定时任务默认切 watch 档(存量安装下次 refresh 静默迁移)
          - **`ghspeed proxy on|off` 一键接管**:发现 Clash 等本机代理后,只把 GitHub 域
            交给它(git 域级配置 + 下载兜底 + PAC 代理跳),off 原样还原
          - **`git on` 不再坑 push**:insteadOf + pushInsteadOf——clone/fetch 走镜像,
            push 自动走真实地址,不用「push 前先 off」
          - **raw 文件 jsDelivr 通道**:dl 通道链追加 cdn/fastly/gcore 官方三边界
            (公共仓 ≤20MB;镜像全灭时的第三条活路,通道级失败自动跳过)
          - **自建镜像一行入池**:`ghspeed mirrors add https://你的Worker域名/`——
            公共镜像寿命一两年,自建才是不死的;同样过真验证才进推荐链
          - **certifi 缺失自愈**:证书包一个候选都没有时现场 `pip --user` 安装
            (venv / python.org 官方装机不再全家 CERTIFICATE_VERIFY_FAILED)
          - 界面体验:菜单栏/Windows UI 缓存秒开、探测防抖(连续 2 拍失败才报波动)、
            单次执行防重复点击、忙项置灰

          ### v0.5.1 变更(架构瘦身 + 生态互通)
          - **SNI 分片拆为可选插件** `ghspeed_sni.py`(按需懒加载,缺失时优雅降级),
            引擎主文件从 3100+ 行瘦回 2300 行,核心测速/下载不再背着实验特性维护
          - **GitHub520 兼容导出**:`ghspeed hosts-export` 把实测钉选写成 GitHub520
            同款格式(probe/refresh 自动刷新默认文件 ~/.ghspeed/hosts),
            SwitchHosts 新增「本地 hosts」方案指向它即可;全部 IP 过 TLS 验证,
            比社区源多一道防污染闸
          - 安装包同时携带插件文件,老版本升级无缝

          ### v0.5.0 变更(地基重整版)
          - **镜像池跨会话记忆评分**:每次验证/下载成败都入账(吞吐 EMA、累计成败、
            最近成功时间),排序实测优先、历史次之,7 天没成功过的自动出局
          - **镜像候选清单 2026-10 实测换血**:ghproxy 公共镜像生态平均寿命一两年,
            死透的(gh.llkk.cc / ghp.ci / ghproxy.cc 等 7 个)移除不留尸位
          - `ghspeed mirrors --export`:把实测通过的池导出为带时间戳的 JSON
            (全生态没有活的「自动健康检查镜像列表」,ghspeed 的验证池可以补位)
          - `ghspeed url`:一键把 GitHub 链接展开成直连 + 各镜像前缀的等价下载链接
          - **测速失败报病因**:证书不匹配(污染)/ TLS 握手失败(SNI)/ 无响应(丢包)/
            TCP 不通(IP 被封),probe 与 status 可见,封锁升级时能第一时间自查
          - hosts 块带 Update time 行;status 显示长期不通的域名及替代走法

          ### macOS(菜单栏 🐙)
          1. 下载 `GHSpeed-macos-*.pkg` 双击安装;被 Gatekeeper 拦截就先
             `xattr -d com.apple.quarantine ~/Downloads/GHSpeed-macos-*.pkg`
          2. 点菜单栏 🐙 → 「开启加速」(或用 `GHSpeed-macos-*.zip` 免安装)

          ### Windows 10+(安装包,内置运行时,免装 Python)
          1. 下载 \`GHSpeed-windows-setup-*.exe\` 双击安装
             (未做代码签名,SmartScreen 若提示:点「更多信息」→「仍要运行」)
          2. 打开 GHSpeed → 「开启加速」→ UAC 选「是」
          3. 关闭窗口会最小化到任务栏托盘 🐙,右键托盘图标可退出
             (操作不弹确认窗,成功结果直接显示在窗口状态行)
             v0.4.13 修复:测速期间整个界面变灰像卡死——现在界面永远可点,
             忙时点击提示「上一项还在跑(N 秒)」,状态行照常显示实时秒数(macOS 同步修复)
             v0.4.11 修复:「关闭加速」偶发报 hosts「拒绝访问(WinError 5)」——
             hosts 被占用时自动重试并退回原地写入,失败也给出能看懂的提示
             v0.4.10 修复:首次打开闪一下黑窗(子进程统一无窗口 + 超时),
             「关闭加速」卡在"正在关闭…"(SNI relay 秒停,不再等 wmic)
             v0.4.8 修复:开过「SNI 分片」后「关闭加速」长时间无反应
             (relay 改协作停止哨兵,off 秒级完成,不再空转 wmic)
          4. 也可用 \`GHSpeed-windows-*.zip\` 便携版(解压双击 \`GHSpeed.exe\`)

          注意:命令行版叫 \`ghspeed-cli.exe\`(终端里用);图形界面是 \`GHSpeed.exe\`。
          v0.3.1 起两者不同名:NTFS 大小写不敏感,旧版同目录互相覆盖会导致"点开是黑窗"

          ### 多级可访问性阶梯(HTTPS 被掐时逐级退守)
          1. hosts 钉 IP(候选含社区 hosts 源,验证后才入池)+ 动态镜像池(发布站拉取,
             逐个验证,下单顺序按实测吞吐排——低延迟≠宽管道;App 启动后台预热,首次下载零冷启动)
          1.5 下载分片并行:≥8MB 自动切 8 片、轮转多通道,片级断点续传,失败退回单流链;
             \`ghspeed dl owner/repo[@分支或tag]\` 整仓 zip 一条命令直接经最快镜像下
             v0.4.12 新增:镜像链按实测吞吐排序;dl 支持 owner/repo 整仓速下;
             sni git on 让 git clone/fetch 走分片 relay(域级配置,任何关闭都还原);
             macOS/Windows 启动预热镜像池
          2. \`ghspeed ssh443 test\` → 通则 \`on\`:git 走 ssh.github.com:443,不走 TLS 无 SNI 可拦
          2.5 浏览器 SNI 分片(v0.4.7 新增,可选):\`ghspeed sni test\` 实测后 \`on\`——
             本地 relay 把 ClientHello 拆散绕过 SNI 识别,仅 GitHub 域分流(PAC 带 DIRECT
             兜底,relay 挂了自动回落直连);任何关闭(显式 off/退 App/总 off)都原样还原
             v0.6.0 加档位:\`ghspeed tier on\` 让浏览器下载也无感走镜像多通道(可选)
          2.8 \`ghspeed proxy on\`(v0.6.0):发现本机 Clash 等代理就一键接管,只影响
             GitHub 域(git + 下载兜底 + PAC 代理跳),off 原样还原
          4. \`ghspeed dns on|off\`:可选接管系统 DNS(状态读系统真实 DNS,UI 按真实状态切换;
             off 永远可取消——备份丢了也会清扫回自动获取);\`ghspeed status\` 一屏自检全部通道
          5. 请求可视化:\`ghspeed live\` 看谁的连接正吃着钉选 IP,\`ghspeed activity\` 回放自身动作(macOS 菜单实时显示、Windows 界面「活动」按钮)

          ### Linux / Debian(命令行,无 UI)
          ```
          sudo dpkg -i ghspeed_*_all.deb
          sudo ghspeed on     # 关闭:sudo ghspeed off
          ```
          开启后自动装 systemd 定时器,每 30 分钟重测刷新。
          EOF
          gh release create "$GITHUB_REF_NAME" $FILES \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
